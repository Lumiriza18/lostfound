
<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Barang | Lost &amp; Found</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: Arial, sans-serif;
            color: #263449;
        }

        .sidebar {
            width: 245px;
            min-height: 100vh;
            background: #163b70;
            position: fixed;
            padding: 28px 18px;
            color: white;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .menu-link {
            display: block;
            color: #dce8f8;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 9px;
            margin-bottom: 9px;
        }

        .menu-link:hover,
        .menu-link.active {
            background: #2d5d9c;
            color: white;
        }

        .main-content {
            margin-left: 245px;
            padding: 35px;
        }

        .content-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,.04);
        }

        .table thead th {
            background: #edf3fb;
            color: #345477;
            font-size: 13px;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
            font-size: 14px;
        }

        .btn-primary {
            background: #245b9e;
            border: none;
        }

        .btn-primary:hover {
            background: #174477;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="brand">Lost &amp; Found</div>

    <a href="/" class="menu-link">Dashboard</a>
    <a href="/#form-barang" class="menu-link">Tambah Barang</a>
    <a href="/data-barang" class="menu-link active">Data Barang</a>
</div>

<!-- KONTEN -->
<div class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold mb-1">Data Barang</h2>
            <p class="text-secondary mb-0">
                Kelola laporan barang hilang dan ditemukan.
            </p>
        </div>

        <a href="/" class="btn btn-primary px-4">
            + Tambah Barang
        </a>
    </div>

    <!-- TABEL DATA -->
    <div class="content-card">

        <form action="/data-barang" method="get"
              class="row g-2 mb-4">

            <div class="col-md-7">
                <input type="text"
                       name="q"
                       class="form-control"
                       placeholder="Cari nama barang..."
                       th:value="${keyword}">
            </div>

            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="SEMUA"
                            th:selected="${filterStatus == 'SEMUA'}">
                        Semua Status
                    </option>

                    <option value="HILANG"
                            th:selected="${filterStatus == 'HILANG'}">
                        Hilang
                    </option>

                    <option value="DITEMUKAN"
                            th:selected="${filterStatus == 'DITEMUKAN'}">
                        Ditemukan
                    </option>
                </select>
            </div>

            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">
                    Cari
                </button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>No.</th>
                    <th>Nama Barang</th>
                    <th>Lokasi</th>
                    <th>Tanggal</th>
                    <th>Status Barang</th>
                    <th>Pengambilan</th>
                    <th>Status Pengantaran</th>
                    <th>Aksi</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="barang, iterasi : ${listBarang}">
                    <td th:text="${iterasi.count}"></td>

                    <td>
                        <strong th:text="${barang.namaBarang}"></strong>
                        <div class="text-secondary small"
                             th:text="${barang.deskripsi}">
                        </div>
                    </td>

                    <td th:text="${barang.lokasi}"></td>

                    <td th:text="${barang.tanggal}"></td>

                    <td>
                        <span th:if="${barang.status == 'HILANG'}"
                              class="badge bg-danger">
                            Hilang
                        </span>

                        <span th:if="${barang.status == 'DITEMUKAN'}"
                              class="badge bg-success">
                            Ditemukan
                        </span>
                    </td>

                    <td th:text="${barang.metodePengambilan != null
                        ? barang.metodePengambilan : '-'}">
                    </td>

                    <td th:text="${barang.statusPengantaran != null
                        ? barang.statusPengantaran : '-'}">
                    </td>

                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/edit/{id}(id=${barang.id})}"
                               class="btn btn-sm btn-warning">
                                Edit
                            </a>

                            <a th:href="@{/hapus/{id}(id=${barang.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Yakin ingin menghapus data ini?')">
                                Hapus
                            </a>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(listBarang)}">
                    <td colspan="8" class="text-center text-secondary py-5">
                        Belum ada data barang.
                    </td>
                </tr>
                </tbody>

            </table>
        </div>

    </div>
</div>

</body>
</html>
